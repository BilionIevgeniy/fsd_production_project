name: Update Loki baseline

# Manual only: re-shoots every story with loki (chrome.docker, same engine
# CI's visual-test job compares against) and commits the result to
# .loki/reference on the branch you run this from. Run it after an
# intentional visual change, then let the regular CI compare against the
# fresh baseline.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Start Storybook
        run: npx start-storybook -p 6006 -c config/storybook --ci &

      - name: Wait for Storybook to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:6006 > /dev/null; then
              echo "Storybook is up"
              exit 0
            fi
            sleep 2
          done
          echo "Storybook did not start in time" >&2
          exit 1

      - name: Regenerate reference screenshots
        run: npx loki update

      - name: Commit new baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .loki/reference .loki/.gitignore
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit"
            exit 0
          fi
          git commit -m "chore: update loki visual baseline [skip ci]"
          git push origin HEAD:${{ github.ref }}
